name: keepalive
on:
  schedule:
    - cron: '0 12 * * 1,4'   # lunes y jueves 12:00 UTC
  workflow_dispatch:          # te deja correrlo a mano desde la pestaña Actions
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        run: |
          curl -sf "https://yfhrgzokjqdyoxahkyqi.supabase.co/rest/v1/fudo_orders?select=fudo_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
